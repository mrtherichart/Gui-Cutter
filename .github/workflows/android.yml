name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gui-cutter-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: JavaScript unit tests
        run: |
          for file in app/src/main/assets/*.mjs app/src/main/assets/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
      - name: Android unit tests and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Check release version and signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^appVersion=//p' gradle.properties)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'ERROR: invalid appVersion'; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "ERROR: v${VERSION} exists. Update appVersion before publishing."; exit 1
          fi
          test -n "$KEYSTORE_BASE64" || { echo 'ERROR: missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'ERROR: missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gui-cutter.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/gui-cutter.jks" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion:"
          cp "$APK" Gui-Cutter.apk
          sha256sum Gui-Cutter.apk > Gui-Cutter.apk.sha256
      - name: Publish signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            Gui-Cutter.apk
            Gui-Cutter.apk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true